<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" font-family="'Fira Sans', 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#003056"/>
      <stop offset="100%" stop-color="#004a7f"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="12" fill="url(#bg)"/>

  <!-- Box 1: Diagnose -->
  <rect x="30" y="35" width="150" height="150" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <text x="105" y="72" text-anchor="middle" fill="#003056" font-size="16" font-weight="bold">Diagnose</text>
  <line x1="55" y1="82" x2="155" y2="82" stroke="#e63946" stroke-width="2"/>
  <text x="105" y="102" text-anchor="middle" fill="#555" font-size="11">Staging</text>
  <text x="105" y="118" text-anchor="middle" fill="#555" font-size="11">Bildgebung</text>
  <text x="105" y="134" text-anchor="middle" fill="#555" font-size="11">Pathologie</text>
  <text x="105" y="150" text-anchor="middle" fill="#555" font-size="11">Biomarker</text>
  <text x="105" y="166" text-anchor="middle" fill="#555" font-size="11">Genetik</text>

  <!-- Arrow 1 -->
  <polygon points="195,105 220,105 220,98 245,110 220,122 220,115 195,115" fill="#e63946"/>

  <!-- Box 2: Tumorkonferenz -->
  <rect x="245" y="35" width="150" height="150" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <text x="320" y="72" text-anchor="middle" fill="#003056" font-size="16" font-weight="bold">Tumorkonferenz</text>
  <line x1="270" y1="82" x2="370" y2="82" stroke="#e63946" stroke-width="2"/>
  <text x="320" y="102" text-anchor="middle" fill="#555" font-size="11">Interdisziplinär</text>
  <text x="320" y="118" text-anchor="middle" fill="#555" font-size="11">Therapieempfehlung</text>
  <text x="320" y="134" text-anchor="middle" fill="#555" font-size="11">Studienempfehlung</text>

  <!-- Arrow 2 -->
  <polygon points="410,105 435,105 435,98 460,110 435,122 435,115 410,115" fill="#e63946"/>

  <!-- Box 3: Therapie -->
  <rect x="460" y="35" width="150" height="150" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <text x="535" y="72" text-anchor="middle" fill="#003056" font-size="16" font-weight="bold">Therapie</text>
  <line x1="485" y1="82" x2="585" y2="82" stroke="#e63946" stroke-width="2"/>
  <text x="535" y="102" text-anchor="middle" fill="#555" font-size="11">Operation</text>
  <text x="535" y="118" text-anchor="middle" fill="#555" font-size="11">Systemtherapie</text>
  <text x="535" y="134" text-anchor="middle" fill="#555" font-size="11">Strahlentherapie</text>
  <text x="535" y="150" text-anchor="middle" fill="#555" font-size="11">Implantat</text>

  <!-- Arrow 3 -->
  <polygon points="625,105 650,105 650,98 675,110 650,122 650,115 625,115" fill="#e63946"/>

  <!-- Box 4: Nachsorge -->
  <rect x="675" y="35" width="195" height="150" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <text x="772" y="72" text-anchor="middle" fill="#003056" font-size="16" font-weight="bold">Nachsorge</text>
  <line x1="700" y1="82" x2="845" y2="82" stroke="#e63946" stroke-width="2"/>
  <text x="772" y="102" text-anchor="middle" fill="#555" font-size="11">Verlauf / Follow-Up</text>
  <text x="772" y="118" text-anchor="middle" fill="#555" font-size="11">Nebenwirkungen</text>
  <text x="772" y="134" text-anchor="middle" fill="#555" font-size="11">Psychoonkologie</text>
  <text x="772" y="150" text-anchor="middle" fill="#555" font-size="11">Sozialdienst</text>

  <!-- Bottom bar: Meldedatensätze -->
  <rect x="30" y="195" width="840" height="18" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="450" y="209" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Meldedatensätze: oBDS  ·  IQTIG QS 18.1  ·  OncoBox (DKG)  ·  IRegG (Implantateregister)</text>
</svg>

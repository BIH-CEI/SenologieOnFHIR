   # ohne direkten Pin zieht der IG Publisher bei jedem Build die jeweils neueste
   # Fassung. Die aelteren Fassungen, die andere Pakete transitiv mitbringen,
   # werden dadurch NICHT verdraengt (getestet 2026-10-09) — deshalb traegt das
   # versionPolicy-Coding zusaetzlich seine CodeSystem-Version.

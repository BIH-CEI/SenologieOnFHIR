name: Test Extractions (oBDS, OncoBox, IQTIG, IRegG)

on:
  push:
    paths:
      - 'input/fsh/**'
      - 'input/maps/**'
      - 'validation/extractions/**'
      - 'scripts/extractions/**'
      - 'scripts/matchbox/**'
      - '.github/workflows/test-extractions.yml'
  pull_request:
    paths:
      - 'input/fsh/**'
      - 'input/maps/**'
      - 'validation/extractions/**'
      - 'scripts/extractions/**'
      - 'scripts/matchbox/**'
  workflow_dispatch:

jobs:
  extractions:
    name: Extraction Snapshot Tests (all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [obds, oncobox, iqtig, iregg]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node (for SUSHI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Build IG with SUSHI
        run: sushi .

      - name: Start Matchbox
        run: |
          docker compose -f docker-compose.matchbox.yaml up -d
          for i in {1..60}; do
            if curl -sf http://localhost:8080/matchboxv3/fhir/metadata > /dev/null; then
              echo "Matchbox ready after ${i}s"; break
            fi
            sleep 1
          done

      - name: Load IG into Matchbox
        run: |
          # Lade alle Profile, CodeSystems, ConceptMaps, StructureMaps in Matchbox
          # Wir nutzen fsh-generated/ statt output/ (kein IG-Publisher noetig)
          FHIR_URL="http://localhost:8080/matchboxv3/fhir"
          # Target-Logical-Models
          for f in fsh-generated/resources/StructureDefinition-{obds,oncobox,iqtig,ireg}-*.json; do
            [ -f "$f" ] || continue
            curl -sf -o /dev/null -X POST "$FHIR_URL/StructureDefinition" \
              -H "Content-Type: application/fhir+json" -d @"$f" || true
          done
          # ConceptMaps
          for f in fsh-generated/resources/ConceptMap-*.json; do
            [ -f "$f" ] || continue
            curl -sf -o /dev/null -X POST "$FHIR_URL/ConceptMap" \
              -H "Content-Type: application/fhir+json" -d @"$f" || true
          done
          # CodeSystems
          for f in fsh-generated/resources/CodeSystem-*.json; do
            [ -f "$f" ] || continue
            curl -sf -o /dev/null -X POST "$FHIR_URL/CodeSystem" \
              -H "Content-Type: application/fhir+json" -d @"$f" || true
          done
          # StructureMaps (FML format)
          ok=0; fail=0
          for f in input/maps/*.map; do
            [ -f "$f" ] || continue
            code=$(curl -sf -o /dev/null -w "%{http_code}" \
              -X POST "$FHIR_URL/StructureMap" \
              -H "Content-Type: text/fhir-mapping" --data-binary @"$f" 2>/dev/null || echo "ERR")
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then ok=$((ok+1)); else fail=$((fail+1)); fi
          done
          echo "Maps: $ok loaded, $fail failed"

      - name: Build test bundles
        run: |
          python3 scripts/extractions/build-test-bundle.py 1
          # weitere Faelle hier hinzufuegen wenn relevant

      - name: Run ${{ matrix.target }} extraction tests
        run: ./scripts/extractions/test-extraction-snapshot.sh ${{ matrix.target }}

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-extraction-diffs
          path: |
            validation/extractions/actual/${{ matrix.target }}/
            validation/extractions/expected/${{ matrix.target }}/
          retention-days: 14

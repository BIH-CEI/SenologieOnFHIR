- resourceType: EvidenceVariable
  id: ev-speicheldrüsenkarzinom-allgemein
  url: https://www.senologie.org/fhir/EvidenceVariable/speicheldrüsenkarzinom-allgemein
  version: "1.0.0"
  name: SpLD_KarzinomAllgemein
  title: "Speicheldrüsenkarzinom (alle Lokalisationen, kurativ resektabel)"
  status: draft
  description: >
    Population für Empfehlung 4.14 (A) (AWMF 007-102OL):
    PatientInnen mit histologisch gesichertem Karzinom einer Speicheldrüse
    (groß oder klein) ohne Fernmetastasierung – kurativ-resektabler Ansatz.
  variableDefinition:
    - variableRole: population
      description: Malignes Speicheldrüsentumor ohne Fernmetastasen
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "126787005"
            display: "Neoplasm of major salivary gland"
  characteristicCombination:
    code: all-of
  characteristic:
    - description: Histologisch gesichertes Karzinom der Speicheldrüse
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "126787005"
            display: "Neoplasm of major salivary gland"
      exclude: false
    - description: Ausschluss Fernmetastasen (M0)
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "399409002"
            display: "Distant metastasis present"
      exclude: true
  note:
    - text: >
        Einschlusskriterium für Primärtherapie-Empfehlung: chirurgische Resektion (R0).
        Spezialisierte Subpopulationen werden in separaten EVs abgebildet
        (ev-speicheldrüsenkarzinom-highgrade, ev-adcc-lokal-fortgeschritten).


- resourceType: EvidenceVariable
  id: ev-adcc-lokal-fortgeschritten
  url: https://www.senologie.org/fhir/EvidenceVariable/adcc-lokal-fortgeschritten
  version: "1.0.0"
  name: SpLD_AdCC_T3T4
  title: "Adenoid-zystisches Karzinom, lokal fortgeschritten (T3/T4, cN0)"
  status: draft
  description: >
    Population für Empfehlung 4.27 (B) (AWMF 007-102OL):
    PatientInnen mit adenoid-zystischem Karzinom im Stadium T3/T4 cN0 –
    Frage: elektive Neck Dissection vs. Watch-and-Wait.
    PICO: P=diese Population, I=elektive ND, C=keine ND, O=regionäre Rezidivrate / OS.
  variableDefinition:
    - variableRole: population
      description: AdCC T3/T4 cN0
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "11671000"
            display: "Adenoid cystic carcinoma"
  characteristicCombination:
    code: all-of
  characteristic:
    - description: Adenoid-zystisches Karzinom
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "11671000"
            display: "Adenoid cystic carcinoma"
      exclude: false
    - description: T3 oder T4 (UICC-Stadien)
      definitionByCombination:
        code: any-of
        characteristic:
          - description: T3 (UICC)
            definitionCodeableConcept:
              coding:
                - system: http://snomed.info/sct
                  code: "1228882005"
                  display: "pT3 category"
          - description: T4 (UICC)
            definitionCodeableConcept:
              coding:
                - system: http://snomed.info/sct
                  code: "1228884006"
                  display: "pT4 category"
      exclude: false
    - description: Kein klinischer LK-Befall (cN0)
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "1229947003"
            display: "cN0 category"
      exclude: false
  note:
    - text: >
        Perineurales Wachstum des AdCC (SNOMED 396394004) relevant für Resektionsplanung,
        wird als measuredVariable in verknüpften Evidence-Ressourcen modelliert.
        T/N-Codes aus UICC/SNOMED-Mapping noch zu verifizieren.

---
- resourceType: EvidenceVariable
  id: ev-parotiskarzinom-fazialisinfiltration
  url: https://www.senologie.org/fhir/EvidenceVariable/parotiskarzinom-fazialisinfiltration
  version: "1.0.0"
  name: SpLD_ParotisKarzinom_Fazialis
  title: "Parotiskarzinom mit präoperativer Fazialisparese"
  status: draft
  description: >
    Population für PICO-Frage zu Fazialismanagement:
    PatientInnen mit Karzinom der Gl. parotidea und präoperativer Fazialisparese –
    negativer unabhängiger Prognosefaktor (Hintergrund Empf. 4.14/4.19).
    PICO: I=Nerverhalt vs. C=Nerventfernung, O=lokale Tumorkontrolle + OS.
  variableDefinition:
    - variableRole: population
      description: Parotiskarzinom mit Fazialisparese
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "45289007"
            display: "Parotid gland structure"
  characteristicCombination:
    code: all-of
  characteristic:
    - description: Karzinom der Glandula parotidea
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "45289007"
            display: "Parotid gland structure"
      exclude: false
    - description: >
        Präoperative N.-facialis-Parese (Tumorinfiltration).
        SNOMED-Lücke: nur kongenitaler/familiärer Code verfügbar.
        Implementierung über klinische Befund-Observation (House-Brackmann-Score).
      definitionCodeableConcept:
        text: "Präoperative Fazialisparese (klinisch)"
      exclude: false
    - description: Ausschluss Fernmetastasen
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "399409002"
            display: "Distant metastasis present"
      exclude: true
  note:
    - text: >
        Fazialisparese ist gemäß Studienlage (Hintergrund Empf. 4.14/4.19) ein negativer
        unabhängiger Prognosefaktor mit höherer Aussagekraft als Perineuralscheideninfiltration.
        Compound-Definition mit House-Brackmann-Grad ≥ III als Schwellenwert.

---
- resourceType: EvidenceVariable
  id: ev-speicheldrüsenkarzinom-r1-indikation-rt
  url: https://www.senologie.org/fhir/EvidenceVariable/speicheldrüsenkarzinom-r1-indikation-rt
  version: "1.0.0"
  name: SpLD_KarzinomR1_RT
  title: "Speicheldrüsenkarzinom nach R1/R2-Resektion (Indikation adjuvante RT)"
  status: draft
  description: >
    Population für PICO-Frage adjuvante Strahlentherapie (Kap. 4.3.1):
    PatientInnen mit Karzinom der Speicheldrüse nach nicht-R0-Resektion (R1 oder R2)
    und/oder High-grade / T3/T4 / PNI – Frage: adjuvante RT ja/nein, Dosis.
    PICO: I=adjuvante RT, C=keine RT, O=lokoregionäre Kontrolle / DFS / OS.
  variableDefinition:
    - variableRole: population
      description: Speicheldrüsenkarzinom nach Resektion mit Risikofaktoren für Lokalrezidiv
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "126787005"
            display: "Neoplasm of major salivary gland"
  characteristicCombination:
    code: all-of
  characteristic:
    - description: Histologisch gesichertes Karzinom der Speicheldrüse, operiert
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "126787005"
            display: "Neoplasm of major salivary gland"
      exclude: false
    - description: >
        Mindestens ein Risikofaktor (any-of):
        R1/R2-Resektion ODER High-grade ODER T3/T4 ODER Perineuralscheideninfiltration.
      definitionByCombination:
        code: any-of
        characteristic:
          - description: Perineuralscheideninfiltration vorhanden
            definitionCodeableConcept:
              coding:
                - system: http://snomed.info/sct
                  code: "369731000"
                  display: "Perineural invasion by tumor present"
          - description: High-grade (Speichelgangkarzinom als proxy)
            definitionCodeableConcept:
              coding:
                - system: http://snomed.info/sct
                  code: "397082006"
                  display: "Salivary duct carcinoma"
          - description: Fernmetastasen vorhanden (Ausschluss anderer Intention)
            definitionCodeableConcept:
              coding:
                - system: http://snomed.info/sct
                  code: "399409002"
                  display: "Distant metastasis present"
      exclude: false
  note:
    - text: >
        R-Status (R0/R1/R2) derzeit als SNOMED-Lücke markiert; Implementierung über
        pathologische Befund-Observation mit LOINC 33756-8 (Surgical margin involvement).
        High-grade als Risikofaktor nur über Histologie-Typen indirekt kodierbar.

# EvidenceVariable resources for AWMF 007-102OL (Speicheldrüsentumoren)
# Leitlinie: S3-Leitlinie Speicheldrüsentumoren, AWMF-Reg.-Nr. 007-102OL, Version 1.0, Juli 2025
# Canonical base: https://www.senologie.org/fhir (Pilot; würde in eigenes IG wandern)
# SNOMED version: http://snomed.info/sct/900000000000207008/version/20261001
#
# Mapping zu EvidenceVariable.variableRole:
#   population   = Einschlusskriterien (P in PICO)
#   exposure     = Intervention (I in PICO)
#   referenceExposure = Vergleichsarm (C in PICO)
#   outcome      = Ergebnismessung (O in PICO)
#   measuredVariable = Effektmodifikator / Stratifikator

---
- resourceType: EvidenceVariable
  id: ev-speicheldrüsentumor-benigne-parotis
  url: https://www.senologie.org/fhir/EvidenceVariable/speicheldrüsentumor-benigne-parotis
  version: "1.0.0"
  name: SpLD_BenignePArotis
  title: "Benigne Raumforderung der Gl. parotidea (klinisch, oberflächlich)"
  status: draft
  description: >
    Population für Empfehlungen 4.2 und 4.3 (AWMF 007-102OL):
    PatientInnen mit klinisch benigne imponierendem, oberflächlich gelegenem,
    verschieblichem Tumor der Glandula parotidea ohne präoperativen Malignitätsverdacht.
  variableDefinition:
    - variableRole: population
      description: Raumforderung der Gl. parotidea ohne Malignitätsverdacht
      observed:
        reference: CodeableConcept
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "255154009"
            display: "Benign neoplasm of salivary gland"
  characteristicCombination:
    code: all-of
  characteristic:
    - description: Tumor der Gl. parotidea
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "45289007"
            display: "Parotid gland structure"
      exclude: false
    - description: Klinisch benigne imponierend (kein Malignomverdacht)
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "255154009"
            display: "Benign neoplasm of salivary gland"
      exclude: false
    - description: Ausschluss Fernmetastasen
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "399409002"
            display: "Distant metastasis present"
      exclude: true
  note:
    - text: >
        Variiert mit Empfehlung 4.2 (B): oberflächlich + verschieblich → EKD-Vorzug.
        Bei tiefer Lage oder klinischen Malignitätszeichen gilt EvidenceVariable
        ev-speicheldrüsenkarzinom-parotis.


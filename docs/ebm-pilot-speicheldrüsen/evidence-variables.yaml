- resourceType: EvidenceVariable
  id: ev-speicheldrüsenkarzinom-highgrade
  url: https://www.senologie.org/fhir/EvidenceVariable/speicheldrüsenkarzinom-highgrade
  version: "1.0.0"
  name: SpLD_KarzinomHighGrade
  title: "High-grade Speicheldrüsenkarzinom (inkl. High-grade-Transformation)"
  status: draft
  description: >
    Population für Empfehlung 4.26 (A) und adjuvante RT-Indikation:
    Speicheldrüsenkarzinom mit High-grade-Histologie oder High-grade-Transformation,
    unabhängig von N-Status → Indikation für elektive ipsilaterale Neck Dissection
    und adjuvante Strahlentherapie.
  variableDefinition:
    - variableRole: population
      description: High-grade Karzinom der Speicheldrüse
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "126787005"
            display: "Neoplasm of major salivary gland"
  characteristicCombination:
    code: all-of
  characteristic:
    - description: Karzinom der Speicheldrüse
      definitionCodeableConcept:
        coding:
          - system: http://snomed.info/sct
            code: "126787005"
            display: "Neoplasm of major salivary gland"
      exclude: false
    - description: >
        High-grade Histologie ODER High-grade-Transformation (ICD-O G3/G4).
        SNOMED-Lücke: kein allgemeiner High-grade-Code; Implementierung über
        pathologische Befundstruktur (Observation.value mit ICD-O-3 Grade).
      definitionByCombination:
        code: any-of
        characteristic:
          - description: Speichelgangkarzinom (inherent high-grade)
            definitionCodeableConcept:
              coding:
                - system: http://snomed.info/sct
                  code: "397082006"
                  display: "Salivary duct carcinoma"
          - description: Karzinom ex pleomorphem Adenom
            definitionCodeableConcept:
              coding:
                - system: http://snomed.info/sct
                  code: "17264009"
                  display: "Carcinoma ex pleomorphic adenoma"
      exclude: false
  note:
    - text: >
        Compound-Definition: umfasst histologisch high-grade Typen + strukturell
        high-grade (Carcinoma ex PA). Grade-Angabe aus Pathologie-Befund
        (ICD-O-3 G3/G4) ergänzt die SNOMED-Typzuordnung.

